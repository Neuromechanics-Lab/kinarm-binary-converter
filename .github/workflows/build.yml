name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  # ── macOS arm64 (Apple Silicon) ──────────────────────────────────────────────
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          mkdir -p bin
          cp build/kinarm-binary-converter bin/kinarm-binary-converter-macos-arm64
          chmod +x bin/kinarm-binary-converter-macos-arm64

      - name: Smoke test
        run: ./bin/kinarm-binary-converter-macos-arm64 --help 2>&1 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinarm-binary-converter-macos-arm64
          path: bin/kinarm-binary-converter-macos-arm64
          retention-days: 30

  # ── Windows x64 ──────────────────────────────────────────────────────────────
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build --config Release
          mkdir -Force bin
          copy build\Release\kinarm-binary-converter.exe bin\kinarm-binary-converter-win64.exe

      - name: Smoke test
        run: .\bin\kinarm-binary-converter-win64.exe --help 2>&1; exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinarm-binary-converter-win64
          path: bin/kinarm-binary-converter-win64.exe
          retention-days: 30

  # ── Linux x86_64 ─────────────────────────────────────────────────────────────
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake g++ make

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          mkdir -p bin
          cp build/kinarm-binary-converter bin/kinarm-binary-converter-linux-x86_64
          chmod +x bin/kinarm-binary-converter-linux-x86_64

      - name: Smoke test
        run: ./bin/kinarm-binary-converter-linux-x86_64 --help 2>&1 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinarm-binary-converter-linux-x86_64
          path: bin/kinarm-binary-converter-linux-x86_64
          retention-days: 30

  # ── Release: attach all binaries when a v* tag is pushed ─────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-macos-arm64, build-windows-x64, build-linux-x86_64 ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: kinarm-binary-converter ${{ github.ref_name }}
          body: |
            ## kinarm-binary-converter ${{ github.ref_name }}

            Converts `.kinarm` files to JSON, CSV, and MATLAB `.mat` format — no MATLAB required.

            ### Download

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `kinarm-binary-converter-macos-arm64` |
            | Windows x64 | `kinarm-binary-converter-win64.exe` |
            | Linux x86_64 | `kinarm-binary-converter-linux-x86_64` |

            ### Usage
            ```bash
            kinarm-binary-converter subject01.kinarm output/subject01
            ```
            See [README](https://github.com/Neuromechanics-Lab/kinarm-binary-converter#readme) for full documentation.
          files: |
            artifacts/kinarm-binary-converter-macos-arm64/kinarm-binary-converter-macos-arm64
            artifacts/kinarm-binary-converter-win64/kinarm-binary-converter-win64.exe
            artifacts/kinarm-binary-converter-linux-x86_64/kinarm-binary-converter-linux-x86_64
          draft: false
          prerelease: false
